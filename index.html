<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <!-- 讓手機與不同尺寸螢幕正常縮放 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini Arcade</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/games/snake.css">
    <link rel="stylesheet" href="css/games/2048.css">
    <link rel="stylesheet" href="css/games/minesweeper.css">
    <link rel="stylesheet" href="css/games/tetris.css">
    <link rel="stylesheet" href="css/games/flappy-sky.css">
    <link rel="stylesheet" href="css/games/drive-ahead.css">
</head>

<body>

    <!-- =========================
         App Header
         ========================= -->
    <header class="app-header">

        <div class="brand">
            <div class="brand-icon" aria-hidden="true">
                <svg
                    class="brand-icon-svg"
                    viewBox="0 0 64 64"
                    role="img"
                >
                    <defs>
                        <linearGradient
                            id="brand-icon-gradient"
                            x1="12"
                            y1="8"
                            x2="54"
                            y2="58"
                            gradientUnits="userSpaceOnUse"
                        >
                            <stop class="brand-icon-gradient-start" offset="0" />
                            <stop class="brand-icon-gradient-end" offset="1" />
                        </linearGradient>
                        <filter
                            id="brand-icon-shadow"
                            x="-20%"
                            y="-20%"
                            width="140%"
                            height="150%"
                        >
                            <feDropShadow
                                dx="0"
                                dy="2"
                                stdDeviation="2"
                                flood-color="#000"
                                flood-opacity=".16"
                            />
                        </filter>
                    </defs>
                    <path
                        d="M20 5h24c8.284 0 15 6.716 15 15v24c0 8.284-6.716 15-15 15H20C11.716 59 5 52.284 5 44V20C5 11.716 11.716 5 20 5Z"
                        class="brand-icon-background"
                        filter="url(#brand-icon-shadow)"
                    />
                    <path
                        d="M17 35.2 32 27.8l15 7.4v7.5L32 50l-15-7.3Z"
                        fill="url(#brand-icon-gradient)"
                        stroke="var(--brand-icon-platform-outline)"
                        stroke-width="1"
                    />
                    <path
                        d="m17 35.2 15 7.4v7.4l-15-7.3Z"
                        fill="var(--brand-icon-platform-highlight)"
                    />
                    <path
                        d="M29.4 25.4h5.2v16.9h-5.2z"
                        fill="var(--brand-icon-control)"
                    />
                    <circle
                        cx="32"
                        cy="22"
                        r="6.3"
                        fill="var(--brand-icon-control)"
                        stroke="var(--brand-icon-control-highlight)"
                        stroke-width="1"
                    />
                    <circle
                        cx="22.5"
                        cy="38.8"
                        r="2.3"
                        fill="var(--brand-icon-control)"
                    />
                </svg>
            </div>

            <div>
                <h1>Mini Arcade</h1>
                <p>Simple games. Offline fun.</p>
            </div>
        </div>

        <div class="header-actions">

            <!-- 主題切換 -->
            <button
                id="themeButton"
                class="icon-button"
                title="切換主題"
                aria-label="切換主題"
            >
                ◐
            </button>

            <!-- 全螢幕 -->
            <button
                id="fullscreenButton"
                class="icon-button"
                title="全螢幕"
                aria-label="全螢幕"
            >
                ⛶
            </button>

        </div>

    </header>


    <!-- =========================
         Main
         ========================= -->
    <main>

        <!-- Hero -->
        <section class="hero">

            <div>
                <span class="eyebrow">OFFLINE GAME COLLECTION</span>

                <h2>
                    Play something<br>
                    simple.
                </h2>

                <p>
                    一個可以完全離線遊玩的個人小遊戲平台。
                </p>
            </div>

        </section>


        <!-- Game Library -->
        <section class="library">

            <div class="section-header">

                <div>
                    <span class="section-label">GAME LIBRARY</span>

                    <h2>所有遊戲</h2>
                </div>

                <div class="library-controls">
                    <span id="gameCount" class="game-count">
                        6 款遊戲
                    </span>

                    <div class="sort-controls">
                        <span id="gameSortLabel">
                            排序
                        </span>

                        <div class="sort-menu-control">
                            <button
                                id="gameSortButton"
                                class="sort-select"
                                type="button"
                                aria-labelledby="gameSortLabel gameSortValue"
                                aria-haspopup="menu"
                                aria-expanded="false"
                                aria-controls="gameSortMenu"
                            >
                                <span id="gameSortValue">
                                    最近遊玩
                                </span>
                                <span
                                    class="sort-select-chevron"
                                    aria-hidden="true"
                                ></span>
                            </button>

                            <div
                                id="gameSortMenu"
                                class="sort-menu"
                                role="menu"
                                aria-labelledby="gameSortLabel"
                                hidden
                            >
                                <button
                                    class="sort-menu-option"
                                    type="button"
                                    role="menuitemradio"
                                    data-sort-mode="recent"
                                    aria-checked="true"
                                >
                                    最近遊玩
                                </button>
                                <button
                                    class="sort-menu-option"
                                    type="button"
                                    role="menuitemradio"
                                    data-sort-mode="name"
                                    aria-checked="false"
                                >
                                    名稱
                                </button>
                                <button
                                    class="sort-menu-option"
                                    type="button"
                                    role="menuitemradio"
                                    data-sort-mode="category"
                                    aria-checked="false"
                                >
                                    類別
                                </button>
                            </div>
                        </div>

                        <button
                            id="sortDirectionButton"
                            class="sort-direction-button"
                            type="button"
                            aria-label="切換排序方向"
                        >
                            ↓ 最新優先
                        </button>
                    </div>
                </div>

            </div>


            <!-- 遊戲卡片會由 JavaScript 自動產生 -->
            <div
                id="gameGrid"
                class="game-grid"
            ></div>

        </section>

    </main>


    <!-- =========================
         Game Modal
         ========================= -->
    <div
        id="gameModal"
        class="modal hidden"
    >

        <div class="modal-backdrop"></div>

        <div class="game-window">

            <!-- 遊戲 Header -->
            <div class="game-header">

                <button
                    id="closeGameButton"
                    class="text-button"
                >
                    ← 遊戲庫
                </button>

                <div class="game-title-area">

                    <h2 id="gameTitle">
                        Game
                    </h2>

                    <span id="gameScore">
                        Score: 0
                    </span>

                </div>

                <div class="game-actions">

                    <button
                        id="pauseButton"
                        class="icon-button"
                        title="暫停"
                    >
                        ⏸
                    </button>

                    <button
                        id="gameFullscreenButton"
                        class="icon-button"
                        title="全螢幕"
                    >
                        ⛶
                    </button>

                </div>

            </div>


            <!-- 遊戲區域 -->
            <div
                id="gameContainer"
                class="game-container"
            ></div>

            <!-- 遊戲狀態 -->
            <div
                id="gameStatus"
                class="game-status"
                aria-live="polite"
                hidden
            >
                <span id="gameStatusMessage"></span>

                <button
                    id="dismissGameStatusButton"
                    class="game-status-dismiss"
                    type="button"
                    aria-label="關閉操作提示"
                    title="關閉提示"
                >
                    ×
                </button>
            </div>

            <!-- 遊戲 Footer -->
            <div class="game-footer">

                <button
                    id="instructionsButton"
                    class="secondary-button"
                >
                    📖 遊戲說明
                </button>

                <button
                    id="restartButton"
                    class="primary-button"
                >
                    ↻ 重新開始
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         Instructions Modal
         ========================= -->
    <div
        id="instructionsModal"
        class="modal hidden"
    >

        <div class="modal-backdrop"></div>

        <div class="instructions-window">

            <div class="instructions-header">

                <h2>遊戲說明</h2>

                <button
                    id="closeInstructionsButton"
                    class="icon-button"
                >
                    ×
                </button>

            </div>

            <div id="instructionsContent"></div>

        </div>

    </div>


    <script src="js/storage.js"></script>
    <script src="js/games/snake.js"></script>
    <script src="js/games/2048.js"></script>
    <script src="js/games/minesweeper.js"></script>
    <script src="js/games/tetris.js"></script>
    <script src="js/games/flappy-sky.js"></script>
    <script src="js/games/drive-ahead.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
