<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <!-- 讓手機與不同尺寸螢幕正常縮放 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini Arcade</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/games/snake.css">
    <link rel="stylesheet" href="css/games/2048.css">
    <link rel="stylesheet" href="css/games/minesweeper.css">
</head>

<body>

    <!-- =========================
         App Header
         ========================= -->
    <header class="app-header">

        <div class="brand">
            <div class="brand-icon">🎮</div>

            <div>
                <h1>Mini Arcade</h1>
                <p>Simple games. Offline fun.</p>
            </div>
        </div>

        <div class="header-actions">

            <!-- 主題切換 -->
            <button
                id="themeButton"
                class="icon-button"
                title="切換主題"
                aria-label="切換主題"
            >
                ◐
            </button>

            <!-- 全螢幕 -->
            <button
                id="fullscreenButton"
                class="icon-button"
                title="全螢幕"
                aria-label="全螢幕"
            >
                ⛶
            </button>

        </div>

    </header>


    <!-- =========================
         Main
         ========================= -->
    <main>

        <!-- Hero -->
        <section class="hero">

            <div>
                <span class="eyebrow">OFFLINE GAME COLLECTION</span>

                <h2>
                    Play something<br>
                    simple.
                </h2>

                <p>
                    一個可以完全離線遊玩的個人小遊戲平台。
                </p>
            </div>

        </section>


        <!-- Game Library -->
        <section class="library">

            <div class="section-header">

                <div>
                    <span class="section-label">GAME LIBRARY</span>

                    <h2>所有遊戲</h2>
                </div>

                <span id="gameCount" class="game-count">
                    3 款遊戲
                </span>

            </div>


            <!-- 遊戲卡片會由 JavaScript 自動產生 -->
            <div
                id="gameGrid"
                class="game-grid"
            ></div>

        </section>

    </main>


    <!-- =========================
         Game Modal
         ========================= -->
    <div
        id="gameModal"
        class="modal hidden"
    >

        <div class="modal-backdrop"></div>

        <div class="game-window">

            <!-- 遊戲 Header -->
            <div class="game-header">

                <button
                    id="closeGameButton"
                    class="text-button"
                >
                    ← 遊戲庫
                </button>

                <div class="game-title-area">

                    <h2 id="gameTitle">
                        Game
                    </h2>

                    <span id="gameScore">
                        Score: 0
                    </span>

                </div>

                <div class="game-actions">

                    <button
                        id="pauseButton"
                        class="icon-button"
                        title="暫停"
                    >
                        ⏸
                    </button>

                    <button
                        id="gameFullscreenButton"
                        class="icon-button"
                        title="全螢幕"
                    >
                        ⛶
                    </button>

                </div>

            </div>


            <!-- 遊戲區域 -->
            <div
                id="gameContainer"
                class="game-container"
            ></div>

            <!-- 遊戲狀態 -->
            <div
                id="gameStatus"
                class="game-status"
                aria-live="polite"
            ></div>

            <!-- 遊戲 Footer -->
            <div class="game-footer">

                <button
                    id="instructionsButton"
                    class="secondary-button"
                >
                    📖 遊戲說明
                </button>

                <button
                    id="restartButton"
                    class="primary-button"
                >
                    ↻ 重新開始
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         Instructions Modal
         ========================= -->
    <div
        id="instructionsModal"
        class="modal hidden"
    >

        <div class="modal-backdrop"></div>

        <div class="instructions-window">

            <div class="instructions-header">

                <h2>遊戲說明</h2>

                <button
                    id="closeInstructionsButton"
                    class="icon-button"
                >
                    ×
                </button>

            </div>

            <div id="instructionsContent"></div>

        </div>

    </div>


    <script src="js/storage.js"></script>
    <script src="js/games/snake.js"></script>
    <script src="js/games/2048.js"></script>
    <script src="js/games/minesweeper.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
